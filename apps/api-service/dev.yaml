apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-service-dev
  namespace: argocd
  labels:
    service: api-service
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/argocd-helm-deployments.git
    targetRevision: main
    path: charts/microservice
    helm:
      valueFiles:
        - ../../environments/api-service/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
