apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-service-prod
  namespace: argocd
  labels:
    service: api-service
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/argocd-helm-deployments.git
    targetRevision: main
    path: charts/microservice
    helm:
      valueFiles:
        - ../../environments/api-service/values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    # Production: manual sync only
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
