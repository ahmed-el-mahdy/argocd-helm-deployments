apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-services
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: api-service
            environment: dev
          - service: api-service
            environment: prod
  template:
    metadata:
      name: "{{service}}-{{environment}}"
      namespace: argocd
      labels:
        service: "{{service}}"
        environment: "{{environment}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/ahmed-el-mahdy/argocd-helm-deployments.git
        targetRevision: main
        path: charts/microservice
        helm:
          valueFiles:
            - "../../environments/{{service}}/values-{{environment}}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{environment}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
