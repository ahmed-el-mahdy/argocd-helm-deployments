# Default values for microservice chart
# Override per service/environment in environments/ folder

replicaCount: 1

image:
  repository: myplatformacr.azurecr.io/api-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilization: 70
  targetMemoryUtilization: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

probes:
  liveness:
    path: /health
    port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    path: /health/ready
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10

env:
  ASPNETCORE_URLS: "http://+:8080"

envFrom: []

secretProvider:
  enabled: false
  provider: azure
  keyvaultName: ""
  tenantId: ""
  objects: []

nodeSelector: {}
tolerations: []
affinity: {}
