{{- if .Values.secretProvider.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secretProvider.provider }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    keyvaultName: {{ .Values.secretProvider.keyvaultName | quote }}
    tenantId: {{ .Values.secretProvider.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.secretProvider.objects }}
        - |
          objectName: {{ .name }}
          objectType: {{ .type | default "secret" }}
        {{- end }}
{{- end }}
